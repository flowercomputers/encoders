name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }}, features=${{ matrix.features || 'default' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        features:
          - ""
          - "tests"
          - "tests,quant-8"
          - "tests,quant-16"
          - "tests,rayon,dim-256"

    steps:
      - uses: actions/checkout@v4

      - name: Set model cache dir
        run: echo "ESE_CACHE_DIR=$HOME/.cache/ese" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Cache model files
        uses: actions/cache@v4
        with:
          path: ~/.cache/ese
          key: ${{ matrix.os }}-hf-model-${{ hashFiles('build.rs') }}

      - name: Run tests (default features)
        if: matrix.features == ''
        run: cargo test

      - name: Run tests (with features)
        if: matrix.features != ''
        run: cargo test --features ${{ matrix.features }}

  nife-acceptance:
    name: NIFE acceptance (stephantulkens/NIFE-mxbai-embed-large-v1)
    runs-on: ubuntu-latest
    env:
      ESE_MODEL: "stephantulkens/NIFE-mxbai-embed-large-v1@970a0151f3faeddbab5c68be38d52bbc5ea719ab"
      ESE_MODEL_SHA256: "fd3b36cb5e4ffeb92ade9fc370151c45418ae78592476a936d513ccb0ff61d06"
      ESE_TOKENIZER_SHA256: "05f709262ae338d32529b88fe4acb0a1ba119ca1e84a85df772acfb8e8bc1361"
      ESE_NORMALIZE_OUTPUT: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set model cache dir
        run: echo "ESE_CACHE_DIR=$HOME/.cache/ese" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Cache NIFE model files
        uses: actions/cache@v4
        with:
          path: ~/.cache/ese
          key: hf-model-nife-970a015

      - name: Run NIFE acceptance tests
        run: cargo test --features tests,dim-1024

  potion-multilingual-acceptance:
    name: Unigram acceptance (minishlab/potion-multilingual-128M)
    runs-on: ubuntu-latest
    env:
      ESE_MODEL: "minishlab/potion-multilingual-128M@73908c3438cf03b6a01bcb9611d62b23d0726f08"
      ESE_MODEL_SHA256: "14b5eb39cb4ce5666da8ad1f3dc6be4346e9b2d601c073302fa0a31bf7943397"
      ESE_TOKENIZER_SHA256: "19f1909063da3cfe3bd83a782381f040dccea475f4816de11116444a73e1b6a1"
      ESE_NORMALIZE_OUTPUT: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set model cache dir
        run: echo "ESE_CACHE_DIR=$HOME/.cache/ese" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Cache potion-multilingual model files
        uses: actions/cache@v4
        with:
          path: ~/.cache/ese
          key: hf-model-potion-ml-73908c3

      - name: Run potion-multilingual acceptance tests
        run: cargo test --features tests,dim-256

  workspace-check:
    name: workspace check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set model cache dir
        run: echo "ESE_CACHE_DIR=$HOME/.cache/ese" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cache model files
        uses: actions/cache@v4
        with:
          path: ~/.cache/ese
          key: hf-model-${{ hashFiles('build.rs') }}
      - run: cargo check --workspace
