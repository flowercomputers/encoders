[package]
name = "encoders"
version = "1.0.0"
edition = "2024"
description = "Static embedding models (sentence-transformers static-mrl and model2vec potion families) compiled into the binary with ese"
readme = "readme.md"
license-file = "license"
authors = ["W. Turner Abney <wta@ieee.org>"]
homepage = "https://github.com/flowercomputers/encoders"
repository = "https://github.com/flowercomputers/encoders"
keywords = ["embeddings", "model2vec", "nlp", "search"]
categories = [
    "text-processing",
    "artificial-intelligence",
    "compression",
    "encoding",
    "science",
]
build = "build.rs"

[workspace]
resolver = "2"
members = ["ese", "ese-unicode", "ese-build", "api-py"]

[profile.release]
codegen-units = 1
lto = "fat"

[features]
default = ["int16"]

# Exactly one model. Cargo features are additive, so to pick a non-default
# model depend on this crate with `default-features = false`.
bekko-static-v1-slim-100k = []
bekko-static-v1-slim-75k = []
bekko-static-v1-slim-50k = []
bekko-static-v1-slim-32k = []
bekko-static-embedding-v1 = []
static-retrieval-mrl-en-v1 = []
static-similarity-mrl-multilingual-v1 = []
potion-base-2m = []
potion-base-4m = []
potion-base-8m = []
potion-base-32m = []
potion-retrieval-32m = []
potion-science-8m = []
potion-science-32m = []
potion-code-16m = []
nife-mxbai-embed-large-v1 = []
nife-gte-modernbert-base = []
m2v-base-output = []

# Truncation. Only the Matryoshka-trained sentence-transformers models accept
# a width below their native 1024; the build fails otherwise.
mrl-1024 = []
mrl-768 = []
mrl-512 = []
mrl-256 = []
mrl-128 = []
mrl-64 = []
mrl-32 = []

float32 = []
int16 = []
int8 = []

rayon = ["ese/rayon"]
# Generate reference embeddings with the `tokenizers` crate and compare
# against them in `cargo test --features tests`.
tests = ["ese-build/test-data"]

[dependencies]
ese = { path = "ese" }

[build-dependencies]
ese-build = { path = "ese-build" }

[dev-dependencies]
criterion = { version = "0", features = ["html_reports"] }
model2vec-rs = "0"
parquet = { version = "58" }
minreq = { version = "2", features = ["https-native"] }

[[bench]]
name = "bench_encode"
harness = false

[[bench]]
name = "gooaq"
harness = false
