[package]
name = "encoders"
version = "2.0.1"
edition = "2024"
description = "The fastest way to semantically embed text inputs"
readme = "readme.md"
license-file = "license"
authors = ["W. Turner Abney <wta@ieee.org>"]
homepage = "https://github.com/flowercomputers/encoders"
repository = "https://github.com/flowercomputers/encoders"
keywords = ["embeddings", "model2vec", "nlp", "search"]
categories = [
    "text-processing",
    "artificial-intelligence",
    "compression",
    "encoding",
    "science",
]
build = "build.rs"
exclude = ["bench/", ".github/"]

[workspace]
resolver = "2"
members = ["ese", "ese-unicode", "ese-build", "api-py", "bench"]

[profile.release]
codegen-units = 1
lto = "fat"

[features]
default = []

# At most one model; with none, build.rs picks the current default
# (bekko-static-v1-slim-100k at 512 dimensions). Enabling two fails the build.
bekko-static-v1-slim-100k = []
bekko-static-v1-slim-75k = []
bekko-static-v1-slim-50k = []
bekko-static-v1-slim-32k = []
bekko-static-embedding-v1 = []
static-retrieval-mrl-en-v1 = []
static-similarity-mrl-multilingual-v1 = []
potion-base-2m = []
potion-base-4m = []
potion-base-8m = []
potion-base-32m = []
potion-retrieval-32m = []
potion-science-8m = []
potion-science-32m = []
potion-code-16m = []
nife-mxbai-embed-large-v1 = []
nife-gte-modernbert-base = []
m2v-base-output = []

# Truncation. Only Matryoshka-trained models (the bekko family and the
# static-*-mrl models) accept a width below their native one, and only a
# width they were trained at; the build fails otherwise.
mrl-1024 = []
mrl-768 = []
mrl-512 = []
mrl-256 = []
mrl-128 = []
mrl-64 = []
mrl-32 = []

# Internal DType. Falls back to int16 if no feature is present.
float32 = []
int16 = []
int8 = []

rayon = ["ese/rayon"]
# Generate reference embeddings with the `tokenizers` crate and compare
# against them in `cargo test --features tests`.
tests = ["ese-build/test-data"]

[dependencies]
ese = { version = "0.2.0", path = "ese" }

[build-dependencies]
ese-build = { version = "0.2.0", path = "ese-build" }
