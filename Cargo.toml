[package]
name = "encoders"
version = "1.0.0"
edition = "2024"
description = "Static embedding models (sentence-transformers static-mrl and model2vec potion families) compiled into the binary with ese"
readme = "readme.md"
license-file = "license"
authors = ["W. Turner Abney <wta@ieee.org>"]
homepage = "https://github.com/flowercomputers/encoders"
repository = "https://github.com/flowercomputers/encoders"
keywords = ["embeddings", "model2vec", "nlp", "search"]
categories = [
    "text-processing",
    "artificial-intelligence",
    "compression",
    "encoding",
    "science",
]
build = "build.rs"

[workspace]
resolver = "2"
members = ["ese", "ese-unicode", "ese-build", "api-py"]

[profile.release]
codegen-units = 1
lto = "fat"

[features]
default = ["quant-16"]

# Exactly one model. Cargo features are additive, so to pick a non-default
# model depend on this crate with `default-features = false`.
model-bekko-static-v1-slim-100k = []
model-bekko-static-v1-slim-75k = []
model-bekko-static-v1-slim-50k = []
model-bekko-static-v1-slim-32k = []
model-static-retrieval-mrl-en-v1 = []
model-static-similarity-mrl-multilingual-v1 = []
model-bekko-static-embedding-v1 = []
model-potion-base-2m = []
model-potion-base-4m = []
model-potion-base-8m = []
model-potion-base-32m = []
model-potion-retrieval-32m = []
model-potion-science-8m = []
model-potion-science-32m = []
model-potion-code-16m = []
model-nife-mxbai-embed-large-v1 = []
model-nife-gte-modernbert-base = []
model-m2v-base-output = []

# Truncation. Only the Matryoshka-trained sentence-transformers models accept
# a width below their native 1024; the build fails otherwise.
dim-1024 = []
dim-768 = []
dim-512 = []
dim-256 = []
dim-128 = []
dim-64 = []
dim-32 = []

# Storage: f32 when neither is set. Per-column affine quantization, summed in
# integer lanes.
quant-16 = []
quant-8 = []

rayon = ["ese/rayon"]
# Generate reference embeddings with the `tokenizers` crate and compare
# against them in `cargo test --features tests`.
tests = ["ese-build/test-data"]

[dependencies]
ese = { path = "ese" }

[build-dependencies]
ese-build = { path = "ese-build" }

[dev-dependencies]
criterion = { version = "0", features = ["html_reports"] }
model2vec-rs = "0"
parquet = { version = "58" }
minreq = { version = "2", features = ["https-native"] }

[[bench]]
name = "bench_encode"
harness = false

[[bench]]
name = "gooaq"
harness = false
