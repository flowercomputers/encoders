[package]
name = "ese-py"
version = "0.1.0"
edition = "2024"

[lib]
name = "ese"
crate-type = ["cdylib"]

[dependencies]
# Default model: bekko-static-v1-slim-75k at 1024 dims, 16-bit. Add a model
# feature, an mrl-* width or float32/int8 to change it.
encoders = { path = "..", features = ["rayon"] }
numpy = "0.28.0"
pyo3 = { version = "0", features = ["extension-module"] }
