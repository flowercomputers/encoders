# Benchmarks for encoders. A separate, unpublished package so the heavy
# comparison crates (candle, tantivy, model2vec-rs, ...) stay out of encoders'
# own dev-dependencies.
#
#   cargo bench -p encoders-bench --bench throughput
#   cargo bench -p encoders-bench --bench embedders
#
# `py/` holds the sentence-transformers side (see py/qps.py).

[package]
name = "encoders-bench"
version = "0.0.0"
edition = "2024"
publish = false

[features]
# Build the encoders bar with encoders' `rayon` feature (batch encode goes
# parallel). The comparison bars are skipped in this build; run it after the
# default one and both ids land in criterion's results.
rayon = ["encoders/rayon"]

[dev-dependencies]
encoders = { path = "..", features=["int8", "mrl-256"] }
criterion = { version = "0", features = ["html_reports"] }
model2vec-rs = "0"
parquet = { version = "58" }
minreq = { version = "2", features = ["https-native"] }
sha2 = { version = "0.10", features = ["force-soft"] }
flate2 = "1.1.11"
tokenizers = { version = "0.23.2", default-features = false, features = ["onig"] }
tantivy = "0.27.0"
serde_json = "1.0.154"
candle-core = "0.11.1"
candle-nn = "0.11.1"
candle-transformers = "0.11.1"

[[bench]]
name = "throughput"
harness = false

[[bench]]
name = "embedders"
harness = false
