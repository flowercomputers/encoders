# Benchmarks for encoders. A separate, unpublished package so the heavy
# comparison crates (tantivy, model2vec-rs, ...) stay out of encoders'
# own dev-dependencies.
#
#   cargo bench -p encoders-bench --bench throughput
#   cargo bench -p encoders-bench --bench queries --features potion-base-8m
#   cargo bench -p encoders-bench --bench corpus --features potion-base-8m
#
# Add `rayon` to the features to record the parallel encoders bar of
# `throughput` and `corpus`.
# `py/` holds the sentence-transformers side (py/qps.py) and the script that
# runs everything and renders the readme charts (py/charts.py).

[package]
name = "encoders-bench"
version = "0.0.0"
edition = "2024"
publish = false

[features]
# Build the encoders bar with encoders' `rayon` feature (batch encode goes
# parallel). The comparison bars are skipped in this build; run it after the
# default one and both ids land in criterion's results.
rayon = ["encoders/rayon"]
# Compile encoders with model2vec-rs's default model, unquantized, so the
# `queries` and `corpus` benches compare the two crates on the same weights.
# Both benches refuse to run without it.
potion-base-8m = ["encoders/potion-base-8m", "encoders/float32"]

[dev-dependencies]
encoders = { path = ".." }
criterion = { version = "0", features = ["html_reports"] }
model2vec-rs = "0"
parquet = { version = "58" }
minreq = { version = "2", features = ["https-native"] }
sha2 = { version = "0", features = ["force-soft"] }
flate2 = "1"
tokenizers = { version = "0", default-features = false, features = ["onig"] }
tantivy = "0"

[[bench]]
name = "throughput"
harness = false

[[bench]]
name = "corpus"
harness = false

[[bench]]
name = "queries"
harness = false
