[project]
name = "distill"
version = "0.1.0"
description = "Distill any HF sentence-transformer into ese-compatible artifacts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "model2vec[distill]>=0.3.0",
    "sentence-transformers>=2.0.0",
    "torch>=2.0.0",
    "safetensors>=0.4.0",
    "numpy>=1.24.0",
    "tokenizers>=0.15.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []
