[package]
name = "ese-build"
version = "0.3.0"
edition = "2024"
description = "build.rs support for ese: fetch a sentence-transformers or model2vec static embedding model and generate its compiled-in tables"
license = "Apache-2.0"
repository = "https://github.com/flowercomputers/encoders"

[features]
# Also generate reference outputs (computed with the `tokenizers` crate) for
# the consumer's test-suite.
test-data = ["dep:tokenizers"]

[dependencies]
ese = { version = "0.3.0", path = "../ese" }
serde_json = "1"
minreq = { version = "2", features = ["https-native"] }
tokenizers = { version = "0", optional = true }
