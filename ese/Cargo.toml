[package]
name = "ese"
version = "0.4.0"
edition = "2024"
description = "Embedded Static Embeddings: runtime for compiled-in static embedding models"
license = "Apache-2.0"
authors = ["W. Turner Abney <wta@ieee.org>"]
homepage = "https://github.com/flowercomputers/encoders/tree/master/ese"
repository = "https://github.com/flowercomputers/encoders"
keywords = ["embeddings", "model2vec", "nlp", "search"]
categories = ["text-processing", "artificial-intelligence", "compression", "encoding", "science"]
rust-version = "1.88"

[features]
default = ["std"]
# Link the standard library. Without it the crate is `no_std`: the
# single-text entry points need neither an allocator nor an OS, and square
# roots come from `libm` instead of the platform's.
std = ["alloc"]
# The batch `encode`, which returns a `Vec`. Implied by `std`; enable it on
# its own for a `no_std` target that has a global allocator.
alloc = []
rayon = ["dep:rayon", "std"]

[dependencies]
ese-unicode = { version = "17.0.0", path = "../ese-unicode" }
# Only called without `std` (for `sqrtf`).
libm = { version = "0.2", default-features = false }
rayon = { version = "1", optional = true }
