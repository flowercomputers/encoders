[project]
name = "greedy-fidelity"
version = "0.1.0"
description = "Spike: measure greedy-ification fidelity on potion-multilingual-128M"
requires-python = ">=3.11"
dependencies = [
    "model2vec>=0.4.0",
    "skeletoken>=0.1.0",
    "tokenizers>=0.21.0",
    "numpy>=1.26.0",
    "huggingface_hub>=0.27.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []
